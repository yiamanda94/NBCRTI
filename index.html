<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>傳統通路戰情表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 版面：頂部摘要帶 → 分頁（營業所總覽／店家查詢）。店家查詢為「清單 | 店家卡」雙欄，手機堆疊 */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#17201C; --muted:#5A6A62; --line:#D7DFD9;
  --accent:#0B6B53; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7;
  --good:#1D7F47; --good-soft:#DCF1E3; --warn:#9A6212; --warn-soft:#F8EBD3; --bad:#B4380B; --bad-soft:#FBE3D7;
  --pace:#6B5BA8;
  --c1:#3D6CB0; --c2:#B04A32; --c3:#C98F12; --c4:#5E8A34; --c5:#8A8F99;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2723; --ink:#E4ECE7; --muted:#92A39A; --line:#2A3631;
  --accent:#4DBF98; --accent-ink:#06231A; --accent-soft:#163A2E;
  --good:#5BC98A; --good-soft:#173726; --warn:#E3AA52; --warn-soft:#3A2C14; --bad:#F2875A; --bad-soft:#3D2015;
  --pace:#A797E6; --c1:#7FA6E6; --c2:#E58A70; --c3:#E8B84A; --c4:#97C46A; --c5:#A3A9B4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2723; --ink:#E4ECE7; --muted:#92A39A; --line:#2A3631;
  --accent:#4DBF98; --accent-ink:#06231A; --accent-soft:#163A2E;
  --good:#5BC98A; --good-soft:#173726; --warn:#E3AA52; --warn-soft:#3A2C14; --bad:#F2875A; --bad-soft:#3D2015;
  --pace:#A797E6; --c1:#7FA6E6; --c2:#E58A70; --c3:#E8B84A; --c4:#97C46A; --c5:#A3A9B4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 頁首 */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.asof{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px}
.asof b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

/* 摘要帶 */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--f-data);font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:2px}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* 分頁 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* 營業所表 */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--sunk);position:sticky;top:0}
th.grp{text-align:center;border-left:1px solid var(--line)}
td.l,th.l{text-align:left}
td.sep,th.sep{border-left:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.oname{font-weight:700}
.ocode{color:var(--muted);font-size:12px;margin-left:6px}
.bar{display:inline-flex;align-items:center;gap:8px}
.bar i{display:block;width:72px;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.pts{display:inline-block;min-width:22px;text-align:center;border-radius:5px;padding:0 6px;font-weight:600}
.pts.on{background:var(--good-soft);color:var(--good)}
.pts.off{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}

/* 狀態膠囊 */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--sunk);color:var(--muted)}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}

/* 篩選列 */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.fl{font-size:11px;color:var(--muted);letter-spacing:.06em}
select,input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;min-width:0}
input[type=search]{width:min(240px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 查詢雙欄 */
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 120px);min-height:200px}
@media (max-width:900px){.list{max-height:420px}}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.listhead select{padding:3px 6px;font-size:12px}
.rows{overflow-y:auto;flex:1}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{grid-column:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px}
.row .r .num{font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* 店家卡 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px}
.card-h h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.25;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.meta b{color:var(--ink);font-weight:500}
.typechip{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:1px 9px;font-weight:700;font-size:13px}
.sec{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv strong{font-family:var(--f-data);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kv strong small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.kv em{font-style:normal;font-size:12px}

/* 進度尺 */
.meter{position:relative;padding-top:18px;padding-bottom:20px}
.track{height:12px;border-radius:6px;background:var(--sunk);position:relative;overflow:visible}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.tick.pace{background:var(--pace);opacity:1;width:2px}
.tlab{position:absolute;top:-18px;font-size:11px;transform:translateX(-50%);white-space:nowrap;color:var(--muted)}
.tlab.below{top:auto;bottom:-20px}
.tlab.pace{color:var(--pace);font-weight:600}
.reward{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:14px}
.reward .num{text-align:right}
.reward .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.reward .sub{color:var(--muted);font-size:12px;grid-column:1/-1;margin-top:-4px}
.note{font-size:13px;background:var(--sunk);border-radius:8px;padding:9px 12px}
.note.good{background:var(--good-soft)}.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}

details.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.rules summary{padding:12px 16px;cursor:pointer;font-weight:600}
.rules-body{padding:0 20px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;font-size:13px}
.rules-body h4{margin:6px 0 4px;font-size:13px}
.rules-body ul{margin:0;padding-left:18px;color:var(--muted)}

/* 更新面板 */
.panel{background:var(--surface);border:1.5px dashed var(--accent);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.drag{background:var(--accent-soft)}
.panel h3{margin:0;font-size:15px}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:13px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill,.bar i b{transition:width .35s ease}}
/* 品類切換 */
.stack{display:flex;flex-direction:column;gap:18px}
.product{display:flex;flex-wrap:wrap;gap:2px;background:var(--sunk);border-radius:10px;padding:3px;align-self:flex-start;max-width:100%}
.prod{border:0;background:none;border-radius:8px;padding:7px 14px 7px 9px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.prod .pk{font-family:var(--f-display);font-weight:900;width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;border:1.5px solid currentColor;font-size:13px}
.prod[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prod[aria-selected="true"] .pk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card-tags{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.contracts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.con{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.con.link{cursor:pointer}
.con.link:hover{background:var(--accent-soft)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tier{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.tier span{font-size:12px;color:var(--muted)}
.tier strong{font-family:var(--f-data);font-size:18px}
.tier em{font-style:normal;font-size:12px;color:var(--muted)}
.tier.on{background:var(--good-soft);border-color:transparent}
.tier.on strong,.tier.on em{color:var(--good)}
table.wide{min-width:1180px}
/* 品類占比與月份圖 */
.catbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);gap:2px}
.catbar i{display:block;height:100%}
.catlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.catlegend>span{display:inline-flex;align-items:center;gap:6px}
.catlegend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.mchart{width:100%;height:auto;display:block}
.mchart .grid{stroke:var(--line);stroke-width:1}
.mchart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-data)}
.mchart .axm{fill:var(--ink);font-weight:600}
.mchart .axv{fill:var(--accent);font-weight:600}
.chartkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.chartkey span{display:inline-flex;align-items:center;gap:6px}
.chartkey b{width:12px;height:10px;border-radius:2px;display:inline-block}
.chartkey .k1{background:var(--line)}.chartkey .k2{border:1.5px dashed var(--muted)}.chartkey .k3{background:var(--accent)}

/* 上方店家查詢 */
h2.sect{font-family:var(--f-display);font-size:20px;margin:6px 0 0;display:flex;align-items:center;gap:10px}
h2.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.query{display:flex;flex-direction:column;gap:10px}
#query{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.qbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.qbar .field.grow{flex:1 1 320px}
.qbar select{min-width:0;max-width:100%}
.qstore{display:flex;flex-wrap:wrap;gap:8px}
.qstore input{flex:0 1 200px;width:auto}
.qstore select{flex:1 1 220px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;user-select:none}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check.off{opacity:.45;cursor:default}
.qempty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
#qres{display:flex;flex-direction:column;gap:14px}
.qhead h2{font-family:var(--f-display);font-size:clamp(22px,3.4vw,28px);margin:0;text-wrap:balance}
.qtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qt{padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.qt span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.qt strong{font-family:var(--f-data);font-size:22px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.qt strong small{font-size:13px;color:var(--muted);font-weight:400;margin-left:2px}
.qt em{font-style:normal;font-size:12px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.qlabel{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.golink{border:0;background:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;font-weight:600}
.golink:hover{text-decoration:underline}
#qres .golink{display:none}

/* 酒特陳架季表 */
.tablebox.flat{border:0;border-radius:0}
table.qtable{min-width:0}
table.qtable th,table.qtable td{padding:7px 10px}
table.qtable tr.cur td{background:var(--accent-soft);font-weight:600}

/* 最上方按鈕列（黏在頂端） */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--sunk);border-radius:12px;padding:4px;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav .prod{flex:1 0 auto;justify-content:center;padding:9px 14px}
.qtabs{display:flex;gap:6px;flex-wrap:wrap}
.qtab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:120px;color:var(--muted);font-weight:600}
.qtab small{font-size:12px;font-weight:400;font-family:var(--f-data)}
.qtab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.t-mute{color:var(--muted)}
td .sub{font-size:11px;font-weight:500}
.chartkey .k4{background:var(--accent-soft);border:1.5px solid var(--accent)}

/* 密碼畫面 */
body.locked .topnav,body.locked #secQuery,body.locked #app,body.locked .asof{display:none!important}
.lock{display:flex;justify-content:center;padding-block:40px}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;display:flex;flex-direction:column;gap:12px;width:min(380px,100%)}
.lockbox h2{font-family:var(--f-display);margin:0;font-size:22px}
.lockbox input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font:inherit;color:inherit}
.lockbox .hint{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="org">傳統通路</span>

<script>
// 解析「傳統菸架客戶購貨進度表」：輸入 {工作表名: 二維陣列}，輸出戰情表資料
// 欄位一律用表頭文字找，不寫死欄位字母，避免明年欄位位移就壞掉
function parseCigWorkbook(sheets) {
  const norm = v => (v == null ? '' : String(v)).replace(/[\s　]/g, '');
  const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
  const txt = v => (v == null ? '' : String(v)).replace(/　/g, ' ').trim();
  const names = Object.keys(sheets);
  const find = re => names.find(n => re.test(n.replace(/\s/g, '')));

  const detName = find(/購貨進度明細/);
  if (!detName) throw new Error('找不到「購貨進度明細表」工作表');
  const det = sheets[detName];
  const hIdx = det.findIndex(r => r && r.some(c => norm(c) === '客戶代號'));
  if (hIdx < 0) throw new Error('明細表找不到「客戶代號」表頭');
  const H = det[hIdx].map(norm);
  const col = (re, from = 0) => { for (let i = from; i < H.length; i++) if (re.test(H[i])) return i; return -1; };
  const need = (re, label, from) => { const i = col(re, from); if (i < 0) throw new Error('明細表缺少欄位：' + label); return i; };

  const qCols = []; H.forEach((h, i) => { if (/Q\d菸品購值/.test(h)) qCols.push(i); });
  if (qCols.length < 2) throw new Error('明細表缺少季購值欄位（如 114 Q4菸品購值）');
  const C = {
    no: col(/^編號$/), cancel: col(/^解約月份$/), office: need(/^營業所$/, '營業所'),
    name: need(/^客戶名稱$/, '客戶名稱'), id: need(/^客戶代號$/, '客戶代號'), chain: col(/系統店|連鎖/),
    biz: col(/^業態/), size: col(/^坪數/), addr: col(/^地址$/), type: need(/^簽約型態/, '簽約型態'),
    items: col(/陳列品項數/), excl: col(/額外獨佔菸格/), cells: col(/格數合計/),
    target: need(/^簽約目標量$/, '簽約目標量'),
    rwD: col(/菸架獎勵\(一般陳列\)/), rwE: col(/菸架獎勵\(獨佔菸格\)/), rwF: col(/菸架獎勵\(系列陳列\)/), rwG: col(/^獎勵合計/),
    rep: col(/負責訪員/), buy: need(/^本月購貨數$/, '本月購貨數'), amt: col(/BW購貨金額/),
    promo: col(/推廣品購貨數量/), qPrev: qCols[0], qCur: qCols[1], qBuy: col(/^本季購貨數/),
  };
  const seriesCols = [];
  const rwG = C.rwG, seriesFrom = C.rep >= 0 ? C.rep + 1 : 0;
  for (let i = seriesFrom; i < Math.min(seriesFrom + 6, H.length); i++) if (/^【|全陳列|風味菸/.test(H[i])) seriesCols.push(i);
  const seriesLabel = i => { const raw = String(det[hIdx][i]).replace(/\s+/g, ''); const m = raw.match(/【(.+?)】([\s\S]*)/); return (m ? m[1] + '：' + m[2] : raw).replace(/\(符合者打"?V"?\)/, '').replace(/^\((.*)\)$/, '$1').replace(/：\((.*)\)$/, '：$1'); };
  const qLabel = i => { const m = String(det[hIdx][i]).match(/(\d+)\s*Q\s*(\d)/); return m ? m[1] + ' Q' + m[2] : txt(det[hIdx][i]); };
  const excludeNote = (() => { const m = H[C.qBuy]?.match(/\((排除.+?)\)/); return m ? m[1] : ''; })();

  const typeOf = v => { const t = norm(v); if (/S/i.test(t)) return '自有S'; if (/A/i.test(t)) return '自有A'; if (/二位/.test(t)) return '二位'; return t || '未填'; };
  const BIZ = { 1: '超市', 2: '傳統雜貨店', 3: '便利商店', 4: '菸酒專', 5: '五金百貨', 6: '農漁會', 7: '其他' };

  const stores = [];
  for (let r = hIdx + 1; r < det.length; r++) {
    const row = det[r]; if (!row) continue;
    const id = txt(row[C.id]);
    if (!/^\d{4}-\d+$/.test(id)) continue;
    const g = i => (i >= 0 ? row[i] : null);
    const type = typeOf(g(C.type));
    const target = num(g(C.target)), buy = num(g(C.buy));
    const qPrev = num(g(C.qPrev)), qCur = num(g(C.qCur)), qBuy = Math.floor(num(g(C.qBuy)));
    const promo = Math.floor(num(g(C.promo)));
    const series = seriesCols.filter(i => txt(row[i])).map(seriesLabel);
    const rate = target > 0 ? buy / target : 0;
    const own = type !== '二位';
    const qRate = qPrev > 0 ? qCur / qPrev : 0;
    stores.push({
      no: num(g(C.no)) || stores.length + 1, id, name: txt(g(C.name)).replace(/^V(?=\S)/, ''), office: txt(g(C.office)),
      cancel: txt(g(C.cancel)), chain: txt(g(C.chain)), biz: BIZ[num(g(C.biz))] || '', size: num(g(C.size)), addr: txt(g(C.addr)),
      type, rep: txt(g(C.rep)), items: num(g(C.items)), excl: num(g(C.excl)), cells: num(g(C.cells)),
      target, rwD: num(g(C.rwD)), rwE: num(g(C.rwE)), rwF: num(g(C.rwF)), rwG: num(g(rwG)), series,
      buy, amt: num(g(C.amt)), rate,
      gap100: Math.max(0, target - buy),
      cap: own ? target * 1.7 : null, gapCap: own ? Math.max(0, target * 1.7 - buy) : null,
      promo, promoOk: own ? promo >= 2 : null,
      qPrev, qCur, qRate, qGap: Math.max(0, qPrev - qCur), qBuy, qBonus: qRate >= 1 ? qBuy * 5 : 0,
      audit: null,
    });
  }
  if (!stores.length) throw new Error('明細表沒有讀到任何客戶資料');

  // 查核進度（選用）
  const audName = find(/查核進度/);
  if (audName) {
    const a = sheets[audName];
    const ah = a.findIndex(r => r && r.some(c => norm(c) === '客戶代號') && r.some(c => /查核進度/.test(norm(c))));
    if (ah >= 0) {
      const AH = a[ah].map(norm);
      const ci = AH.indexOf('客戶代號'), pi = AH.findIndex(h => /查核進度/.test(h)), qi = AH.findIndex(h => /合格/.test(h));
      const map = {};
      for (let r = ah + 1; r < a.length; r++) {
        const row = a[r]; if (!row) continue; const id = txt(row[ci]); if (!/^\d{4}-\d+$/.test(id)) continue;
        const p = norm(row[pi]), q = norm(row[qi]);
        map[id] = (p === 'v' || p === 'V') ? (q === '不合格' ? '不合格' : '合格') : '未查核';
      }
      stores.forEach(s => { s.audit = map[s.id] || '未查核'; });
    }
  }

  // 資料日期：總表內「截至1007止」
  let asOf = '';
  const sumName = find(/購貨總表/);
  const scan = sumName ? sheets[sumName] : det.slice(0, 5);
  outer: for (const row of scan.slice(0, 6)) for (const c of row || []) { const m = String(c ?? '').match(/截至\s*(\d{3,4})/); if (m) { asOf = m[1]; break outer; } }
  let title = '';
  for (const row of (sumName ? sheets[sumName] : det).slice(0, 2)) for (const c of row || []) if (!title && /進度表/.test(String(c ?? ''))) title = txt(c).replace(/\s+/g, ' ');

  const offices = [];
  stores.forEach(s => { if (!offices.includes(s.office)) offices.push(s.office); });
  const out = {
    title, asOf, qPrevLabel: qLabel(C.qPrev), qCurLabel: qLabel(C.qCur), excludeNote,
    seriesLabels: seriesCols.map(seriesLabel), offices, stores, hasAudit: stores.some(s => s.audit),
    builtAt: new Date().toISOString(),
  };
  return JSON.parse(JSON.stringify(out, (k, v) => typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 1000) / 1000 : v));
}


// 解析「啤酒傳統店家商化管理活動 購貨進度」：輸入 {工作表名: 二維陣列}
// 獎勵一律依 115 年規定自行計算，不依賴表內的獎勵欄（那些欄常為貼上值）
const BEER_RULES = {
  contracts: {
    zone:   {label: '專區落地',   th: 30000, reward: 48, rewardTxt: '2 箱'},
    end:    {label: '單座端架',   th: 30000, reward: 24, rewardTxt: '1 箱'},
    s20:    {label: '20 箱落地',  th: 20000, reward: 12, rewardTxt: '2 手'},
    s30:    {label: '30 箱落地',  th: 30000, reward: 24, rewardTxt: '1 箱'},
    small:  {label: '小型陳列架', th: 20000, reward: 12, rewardTxt: '2 手'},
    fridge: {label: '冰箱黃金',   th: 30000, reward: 24, rewardTxt: '1 箱'},
  },
  buyStep: 30000, fridgeBuyCap: 2,
  yearTiers: [1.05, 1.10, 1.15],
  yearReward: {'C': [2, 3, 4], 'B': [6, 8, 10], 'A': [15, 20, 25]},
};

function parseBeerWorkbook(sheets) {
  const norm = v => (v == null ? '' : String(v)).replace(/[\s　]/g, '');
  const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
  const txt = v => (v == null ? '' : String(v)).replace(/　/g, ' ').trim();
  const names = Object.keys(sheets);
  const find = re => names.find(n => re.test(n.replace(/\s/g, '')));
  const office = v => txt(v).replace(/營業所$/, '').replace(/所$/, '');

  /* 月購貨進度 */
  const pName = find(/^購貨進度$/) || find(/購貨進度/);
  if (!pName) throw new Error('找不到「購貨進度」工作表');
  const P = sheets[pName];
  const h0 = P.findIndex(r => r && r.some(c => norm(c) === '店家名稱') && r.some(c => /BW代號/.test(norm(c))));
  if (h0 < 0) throw new Error('購貨進度表找不到「店家名稱」「BW代號」表頭');
  // 多列表頭：每列往右補齊合併儲存格，再把同一欄上下的文字串成路徑
  const W = Math.max(...P.slice(h0, h0 + 6).map(r => (r || []).length));
  const rowsH = P.slice(h0, h0 + 6).map(r => { const out = []; let last = ''; for (let c = 0; c < W; c++) { const v = norm(r?.[c]); if (v) last = v; out.push(v || last); } return out; });
  const path = c => rowsH.map(r => r[c]);
  const colOf = test => { for (let c = 0; c < W; c++) if (test(path(c), c)) return c; return -1; };
  const has = (p, re) => p.some(s => re.test(s));
  const join = c => P.slice(h0, h0 + 6).map(r => norm(r?.[c])).join('|');
  const C = {
    name: colOf(p => p[0] === '店家名稱'), id: colOf(p => /BW代號/.test(p[0])), office: colOf(p => p[0] === '簽約家數'),
    zone: colOf(p => /參加活動/.test(p[0]) && has(p, /^專區/)),
    end: colOf(p => /參加活動/.test(p[0]) && has(p, /^端架/)),
    s20: colOf((p, c) => /參加活動/.test(p[0]) && /20箱/.test(join(c))),
    s30: colOf((p, c) => /參加活動/.test(p[0]) && /30箱/.test(join(c))),
    small: colOf((p, c) => /參加活動/.test(p[0]) && /小型陳列架/.test(join(c))),
    fridge: colOf((p, c) => /參加活動/.test(p[0]) && /冰箱陳列/.test(join(c))),
    pBottle: colOf(p => has(p, /^促銷購貨金額/) && p[p.length - 1] === '瓶裝'),
    pCan: colOf(p => has(p, /^促銷購貨金額/) && p[p.length - 1] === '罐裝'),
    nBottle: colOf((p, c) => has(p, /^無促銷/) && /瓶裝類/.test(join(c))),
    nCan: colOf((p, c) => has(p, /^無促銷/) && /罐裝類/.test(join(c))),
    nTotal: colOf((p, c) => /合計\(B\)/.test(join(c))),
    total: colOf((p, c) => /當月總購值/.test(join(c))),
    ret: colOf((p, c) => /銷退金額/.test(join(c))),
    ly: colOf((p, c) => /去年同期購額/.test(join(c))),
  };
  ['name', 'id', 'nTotal'].forEach(k => { if (C[k] < 0) throw new Error('購貨進度表缺少欄位：' + {name: '店家名稱', id: 'BW代號', nTotal: '無促銷合計(B)'}[k]); });
  if (C.office < 0) C.office = 1;

  let lastOffice = '';
  const stores = [];
  for (let r = h0 + 6; r < P.length; r++) {
    const row = P[r]; if (!row) continue;
    const id = txt(row[C.id]);
    if (!/^\d{4}-\d+$/.test(id)) continue;
    if (txt(row[C.office])) lastOffice = office(row[C.office]);
    const on = k => C[k] >= 0 && txt(row[C[k]]) !== '' && txt(row[C[k]]) !== '0';
    const contracts = ['zone', 'end', 's20', 's30', 'small', 'fridge'].filter(on);
    const promo = num(row[C.pBottle]) + num(row[C.pCan]);
    const nonPromo = num(row[C.nTotal]);
    const total = C.total >= 0 && row[C.total] != null && row[C.total] !== '' ? num(row[C.total]) : promo + nonPromo;
    stores.push({
      id, name: txt(row[C.name]).replace(/\((\d+月)?新[^)]*\)$/, '').trim(), rawName: txt(row[C.name]), office: lastOffice, contracts,
      promoBottle: num(row[C.pBottle]), promoCan: num(row[C.pCan]), promo,
      nonPromoBottle: num(row[C.nBottle]), nonPromoCan: num(row[C.nCan]), nonPromo, total,
      returns: num(row[C.ret]), lastYear: num(row[C.ly]),
    });
  }
  if (!stores.length) throw new Error('購貨進度表沒有讀到任何店家');

  /* 年度達成 */
  const yName = find(/年度達成/);
  let yearAsOf = '';
  if (yName) {
    const Y = sheets[yName];
    for (const row of Y.slice(0, 3)) for (const c of row || []) { const m = String(c ?? '').match(/截至\s*(\d{1,2}\/\d{1,2})/); if (m && !yearAsOf) yearAsOf = m[1]; }
    const yh = Y.findIndex(r => r && r.some(c => norm(c) === '客戶代碼') && r.some(c => norm(c) === '分級'));
    if (yh >= 0) {
      const H = Y[yh].map(norm);
      const ci = H.indexOf('客戶代碼'), gi = H.indexOf('分級');
      const prev = H.findIndex(h => /^\d+年購額/.test(h)), base = H.findIndex(h => /同期基準/.test(h));
      const cur = H.findIndex((h, i) => /^\d+年購額/.test(h) && i !== prev);
      const prevLabel = (H[prev] || '').match(/^(\d+)年/)?.[1], curLabel = (H[cur] || '').match(/^(\d+)年/)?.[1];
      const map = {};
      for (let r = yh + 1; r < Y.length; r++) {
        const row = Y[r]; if (!row) continue; const id = txt(row[ci]); if (!/^\d{4}-\d+$/.test(id)) continue;
        const g = (txt(row[gi]).match(/([ABC])級/) || [])[1] || '';
        map[id] = {grade: g, prevYear: num(row[prev]), base: base >= 0 ? num(row[base]) : Math.max(num(row[prev]), g === 'C' ? 360000 : 0), ytd: num(row[cur])};
      }
      stores.forEach(s => { s.year = map[s.id] || null; });
      var yearLabels = {prev: prevLabel || '', cur: curLabel || ''};
    }
  }

  /* 日期與標題 */
  let title = '', asOf = '', month = '', region = '';
  for (const row of P.slice(0, h0)) for (const c of row || []) {
    const s = txt(c);
    if (!title && /購貨進度/.test(s)) { title = s; const m = s.match(/(\d{1,2})\/(\d{1,2})(?:\s*(\d{1,2}:\d{2}))?/); if (m) asOf = `${+m[1]}/${m[2]}${m[3] ? ' ' + m[3] : ''}`; const mm = s.match(/-(\d{1,2})月購貨進度/); if (mm) month = mm[1]; }
    const rg = s.match(/營業處[：:]\s*(\S+)/); if (rg) region = rg[1];
  }
  const offices = [];
  stores.forEach(s => { if (!offices.includes(s.office)) offices.push(s.office); });
  const out = {kind: 'beer', title, asOf, month, region, yearAsOf, yearLabels: yearLabels || {prev: '', cur: ''}, offices, stores, builtAt: new Date().toISOString()};
  return JSON.parse(JSON.stringify(out, (k, v) => typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 100) / 100 : v));
}

/* 依規定計算單店獎勵（頁面與驗證共用） */
function beerCalc(s) {
  const R = BEER_RULES, cs = s.contracts, K = R.contracts;
  const display = cs.filter(k => k !== 'fridge'), fridge = cs.includes('fridge');
  // 購貨獎勵：只認列無促銷購貨，每滿 3 萬 1 箱；只簽冰箱者上限 2 箱；簽兩項不重複計算
  const raw = Math.max(0, Math.floor(s.nonPromo / R.buyStep));
  const capped = !display.length && fridge;
  const buyBoxes = capped ? Math.min(R.fridgeBuyCap, raw) : raw;
  const buyNext = capped && raw >= R.fridgeBuyCap ? null : s.nonPromo < 0 ? R.buyStep - s.nonPromo : R.buyStep - (s.nonPromo % R.buyStep);
  // 陳列獎勵：以當月總購值判斷；簽兩項者門檻相加，不重複計算
  const items = cs.map(k => ({key: k, ...K[k]}));
  const sumTh = items.reduce((a, x) => a + x.th, 0);
  let got = [];
  if (items.length && s.total >= sumTh) got = items.map(x => x.key);
  else if (items.length) { const ok = items.filter(x => s.total >= x.th).sort((a, b) => b.reward - a.reward); if (ok.length) got = [ok[0].key]; }
  const displayCans = items.filter(x => got.includes(x.key)).reduce((a, x) => a + x.reward, 0);
  const pushTarget = cs.length >= 2 ? 60000 : 30000;
  // 年度達成
  let year = null;
  if (s.year) {
    const y = s.year, rate = y.base ? y.ytd / y.base : 0, tbl = R.yearReward[y.grade] || [0, 0, 0];
    let tier = -1; R.yearTiers.forEach((t, i) => { if (rate >= t) tier = i; });
    year = {...y, rate, tier, boxes: tier >= 0 ? tbl[tier] : 0, table: tbl, gaps: R.yearTiers.map(t => Math.max(0, y.base * t - y.ytd))};
  }
  return {display, fridge, buyBoxes, buyNext, capped, items, got, sumTh, displayCans, displayGap: Math.max(0, sumTh - s.total), pushTarget, pushGap: Math.max(0, pushTarget - s.total), year};
}

// 解析「傳統酒類陳列簽約店家－購值追蹤」（酒特陳架）
// 規則：每季活動品項購值 ≥ 3 萬（BW 開單含稅、不含瓶箱）且購買 ≥ 10 品項（排除米酒類），兩者都要符合
const LIQ_RULES = {amt: 30000, items: 10, cost: 1260};
function parseLiqWorkbook(sheets) {
  const norm = v => (v == null ? '' : String(v)).replace(/[\s　]/g, '');
  const txt = v => (v == null ? '' : String(v)).replace(/　/g, ' ').trim();
  const num = v => { if (v == null || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : null; };
  const names = Object.keys(sheets);

/* 戰情表資料加密：PBKDF2-SHA256（25 萬次）導出金鑰，AES-GCM 256 加密，先 gzip 壓縮 */
const TWCrypt = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const pipe = async (u8, ts) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer());
  async function key(pw, salt, iter) {
    const k = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, k, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  }
  async function encrypt(obj, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
    let data = te.encode(JSON.stringify(obj)), z = 0;
    if (typeof CompressionStream !== 'undefined') { data = await pipe(data, new CompressionStream('gzip')); z = 1; }
    const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await key(pw, salt, iter), data));
    return {enc: 'tw-aesgcm-v1', iter, z, salt: b64(salt), iv: b64(iv), data: b64(ct)};
  }

  }

  return {encrypt, decrypt, isEnc};
})();

}

  const html = liq ? (v.tab === 'store' ? liqStore() : liqOffice()) : perf ? (v.tab === 'store' ? perfStore() : perfOffice()) : beer ? (v.tab === 'store' ? beerStore() : beerOffice()) : (v.tab === 'store' ? cigStore() : cigOffice());

function mergeLiq() {

  DL.curQ = o.curQ; DL.asOf = o.asOf; DL.bwQ = 0;

    if (qN > o.curQ) {
      for (const s of DL.stores) for (let q = o.curQ; q < qN; q++) { const L = map.get(s.id)?.liq; s.amts[q] = L ? Math.round(L.a[q] * 1.05) : 0; s.items[q] = L ? L.n[q] : 0; }
      DL.curQ = qN; DL.bwQ = qN; const m = String(DP.refreshed).match(/\d{4}\/(\d{1,2})\/(\d{1,2})/); if (m) DL.asOf = `${m[1]}/${m[2]}`;

/* ── 密碼解鎖 ── */
const SKEY = 'tw.pw';
const sget = () => { try { return sessionStorage.getItem(SKEY); } catch (e) { return null; } };
const sset = v => { try { v ? sessionStorage.setItem(SKEY, v) : sessionStorage.removeItem(SKEY); } catch (e) {} };
async function openAll(raw, pw) { return Promise.all(raw.map(o => TWCrypt.isEnc(o) ? TWCrypt.decrypt(o, pw) : o)); }
async function unlock(raw) {
  const saved = sget();
  if (saved) { try { return await openAll(raw, saved); } catch (e) { sset(null); } }
  document.body.classList.add('locked'); $('#lock').hidden = false;
  if (!window.crypto?.subtle || typeof DecompressionStream === 'undefined') { $('#lockMsg').textContent = '這個瀏覽器版本太舊，無法解密。請改用最新版的 Chrome 或 Edge。'; $('#lockMsg').className = 'msg err'; }
  setTimeout(() => $('#lockPw').focus(), 50);
  return new Promise(resolve => {
    $('#lockForm').onsubmit = async e => {
      e.preventDefault();
      const pw = $('#lockPw').value, btn = $('#lockBtn'), m = $('#lockMsg');
      btn.disabled = true; m.className = 'msg'; m.textContent = '解密中…';
      try {
        const out = await openAll(raw, pw);
        sset(pw); document.body.classList.remove('locked'); $('#lock').hidden = true; m.textContent = '';
        resolve(out);
      } catch (err) { m.className = 'msg err'; m.textContent = '密碼不正確，請再試一次。'; $('#lockPw').select(); }
      finally { btn.disabled = false; }
    };
  });
}
async function getJson(path) { try { const r = await fetch(path, {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } }
async function load() {
  const p = store.get('tw.prod'); if (['query', 'beer', 'cig', 'perf', 'liq'].includes(p)) S.prod = p;
  ['cig', 'beer', 'perf', 'liq'].forEach(k => { const t = store.get('tw.tab.' + k); if (t === 'store' || t === 'office') ({cig: VC, beer: VB, perf: VP, liq: VL})[k].tab = t; });
  let raw = await Promise.all([getJson('data.json'), getJson('beer.json'), getJson('perf.json'), getJson('liq.json')]);
  if (raw.some(TWCrypt.isEnc)) raw = await unlock(raw);
  const [c, b, pf, lq] = raw;
  if (lq) try { setLiq(lq); } catch (e) { DL = null; }
  if (pf) try { setPerf(pf); } catch (e) { DP = null; }
  loadQ();
  if (c) setCig(c);
  if (b) try { setBeer(b); } catch (e) { DB = null; }
  buildIndex(); render();
}

let canWrite = false;

load();
